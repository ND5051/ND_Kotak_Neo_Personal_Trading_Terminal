<div class="card funds-widget" id="funds-widget">
    <div class="widget-header">
        <div class="widget-title">
            <span class="widget-icon">💰</span>
            <h3>Funds &amp; Margin Account</h3>
        </div>
        <button class="btn btn-xs btn-ghost" id="refresh-funds-btn" title="Refresh Margins">
            <span class="refresh-icon">🔄</span>
        </button>
    </div>

    <div class="widget-body">
        <div class="funds-grid">
            <div class="funds-metric-card">
                <span class="metric-label">Available Cash</span>
                <span class="metric-value font-numeric" id="funds-avail-cash">₹0.00</span>
                <span class="metric-subtext">Trading Capital</span>
            </div>
            <div class="funds-metric-card">
                <span class="metric-label">Collateral Margin</span>
                <span class="metric-value font-numeric" id="funds-collateral">₹0.00</span>
                <span class="metric-subtext">Pledged Holdings</span>
            </div>
            <div class="funds-metric-card">
                <span class="metric-label">Used Margin</span>
                <span class="metric-value font-numeric text-danger" id="funds-used-margin">₹0.00</span>
                <span class="metric-subtext">Positions &amp; Orders</span>
            </div>
            <div class="funds-metric-card highlight">
                <span class="metric-label">Total Margin</span>
                <span class="metric-value font-numeric" id="funds-total-avail">₹0.00</span>
                <span class="metric-subtext">Net Buying Power</span>
            </div>
        </div>

        <div class="margin-progress-section">
            <div class="progress-labels">
                <span class="progress-title">Margin Utilization</span>
                <span class="progress-percent font-numeric" id="margin-util-percent">0.0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-bar util-normal" id="margin-progress-bar" style="width: 0%;"></div>
            </div>
            <div class="progress-thresholds">
                <span class="threshold-label safe">0% Safe</span>
                <span class="threshold-label warning">70% Caution</span>
                <span class="threshold-label critical">85% Limit</span>
            </div>
        </div>

        <div class="funds-alert hidden" id="funds-margin-alert">
            <span class="alert-icon">⚠️</span>
            <span class="alert-msg" id="funds-alert-msg">Margin utilization exceeds safe limits!</span>
        </div>
    </div>
</div>
