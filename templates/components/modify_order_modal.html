<!-- Phase 11C: Modify Order Modal Component -->
<div class="modal-backdrop hidden" id="modify-order-modal">
    <div class="modal-dialog modal-md">
        <div class="modal-header">
            <div>
                <h3>Modify Order</h3>
                <span class="timeline-order-sub" id="modify-order-sub">
                    <span class="font-numeric" id="modify-client-order-id">cli_ord_...</span> &bull; 
                    <span id="modify-symbol-side">NIFTYBEES-EQ BUY</span>
                </span>
            </div>
            <button class="btn btn-sm btn-icon" id="modify-modal-close" title="Close modal">✕</button>
        </div>

        <div class="modal-body">
            <!-- Order Context Bar -->
            <div class="card" style="margin-bottom: 1rem; padding: 0.75rem 1rem; background: var(--bg-surface-elevated, #161b22); display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span class="text-secondary" style="font-size: 0.75rem; text-transform: uppercase;">Product Type</span>
                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.2rem;">
                        <span class="badge badge-primary font-numeric" id="modify-product-badge">CNC</span>
                        <span class="text-muted" style="font-size: 0.7rem;">🔒 Fixed per exchange rules</span>
                    </div>
                </div>
                <div style="text-align: right;">
                    <span class="text-secondary" style="font-size: 0.75rem; text-transform: uppercase;">Broker Order ID</span>
                    <div class="font-numeric text-primary" id="modify-broker-id" style="font-size: 0.85rem; margin-top: 0.2rem;">--</div>
                </div>
            </div>

            <!-- Form Controls -->
            <form id="modify-order-form" onsubmit="return false;">
                <!-- Order Type Selection -->
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="form-label" style="font-size: 0.8rem; margin-bottom: 0.4rem; display: block;">Order Type</label>
                    <div class="seg-pills" id="modify-type-pills" style="display: flex; gap: 0.5rem;">
                        <button type="button" class="btn btn-sm btn-pill active" data-type="LIMIT">LIMIT</button>
                        <button type="button" class="btn btn-sm btn-pill" data-type="MARKET">MARKET</button>
                        <button type="button" class="btn btn-sm btn-pill" data-type="SL">SL (Limit)</button>
                        <button type="button" class="btn btn-sm btn-pill" data-type="SL_M">SL-M</button>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                    <!-- Quantity Input -->
                    <div class="form-group">
                        <label class="form-label" for="modify-qty-input" style="font-size: 0.8rem;">Quantity</label>
                        <div class="input-stepper" style="display: flex; align-items: center;">
                            <button type="button" class="btn btn-sm btn-secondary" id="modify-qty-minus">-</button>
                            <input type="number" id="modify-qty-input" class="form-control text-center font-numeric" min="1" step="1" required style="flex: 1; margin: 0 4px;" />
                            <button type="button" class="btn btn-sm btn-secondary" id="modify-qty-plus">+</button>
                        </div>
                    </div>

                    <!-- Price Input -->
                    <div class="form-group">
                        <label class="form-label" for="modify-price-input" style="font-size: 0.8rem;">Price (₹)</label>
                        <div class="input-stepper" style="display: flex; align-items: center;">
                            <button type="button" class="btn btn-sm btn-secondary" id="modify-price-minus">-</button>
                            <input type="number" id="modify-price-input" class="form-control text-center font-numeric" min="0.05" step="0.05" required style="flex: 1; margin: 0 4px;" />
                            <button type="button" class="btn btn-sm btn-secondary" id="modify-price-plus">+</button>
                        </div>
                    </div>
                </div>

                <!-- Trigger Price (Only for SL / SL-M) -->
                <div class="form-group hidden" id="modify-trigger-group" style="margin-bottom: 1rem;">
                    <label class="form-label" for="modify-trigger-input" style="font-size: 0.8rem;">Trigger Price (₹)</label>
                    <div class="input-stepper" style="display: flex; align-items: center;">
                        <button type="button" class="btn btn-sm btn-secondary" id="modify-trigger-minus">-</button>
                        <input type="number" id="modify-trigger-input" class="form-control text-center font-numeric" min="0.05" step="0.05" style="flex: 1; margin: 0 4px;" />
                        <button type="button" class="btn btn-sm btn-secondary" id="modify-trigger-plus">+</button>
                    </div>
                </div>

                <!-- Product Type Note -->
                <div class="alert alert-info" style="font-size: 0.75rem; padding: 0.5rem 0.75rem; margin-top: 0.5rem; background: rgba(56, 189, 248, 0.08); border-left: 3px solid var(--accent-info, #38bdf8);">
                    💡 <strong>Product Type (CNC / MIS)</strong> cannot be changed on an active resting order per NSE exchange rules. To switch product type, cancel this order and place a new one.
                </div>
            </form>
        </div>

        <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 0.75rem; padding: 1rem; border-top: 1px solid var(--border-color, #30363d);">
            <button class="btn btn-secondary" id="modify-cancel-btn">Cancel</button>
            <button class="btn btn-primary" id="modify-submit-btn">Update Order</button>
        </div>
    </div>
</div>
